<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            justify-content: space-between;
            display: flex;
        }
        .box{
            border: 1px solid black;
            height: 10vh;
            width: 10vw;
            background-color: blueviolet;
            padding: 50px;
        }
    </style>
</head>
<body>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <div class="con">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <br>

    <button id="Hide">click here</button>
    <script>
        $(document).ready(function() {
            $("#Hide").click(function() {
                $(".box").hide();
            });
        });
    </script>
</body>
</html>
