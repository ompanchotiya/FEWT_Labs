<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n=parseInt(prompt("enter a starting number: "))
        let m=parseInt(prompt("enter a last number: "))
        let count=0

        for(let i=n;i<=m;i++){
            for(let j=1;j<=i;j++){
                if(i%j==0){
                    count++
                }
            }
            if(count==2){
                document.write(i)
                document.write("</br>")
            }
            count=0
        }
    </script>
</body>
</html>
