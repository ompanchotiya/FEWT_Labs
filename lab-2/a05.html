<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n=parseInt(prompt("enter a two digits number: "))
        let digit1
        let digit2
        let ans=1

        digit1=parseInt(n/10)
        digit2=n%10

        for(let i=1;i<=digit2;i++){
            ans=ans*digit1
        }
        document.write(ans)
    </script>
</body>
</html>
