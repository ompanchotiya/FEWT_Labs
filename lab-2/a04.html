<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n=parseInt(prompt("enter a small number: "))
        let m=parseInt(prompt("enter a large number: "))
        let gcd=1
        for(let i=1;i<=n;i++){
            if(n%i==0 && m%i==0){
                gcd=i
            }
        }
        document.write(gcd)
    </script>
</body>
</html>
