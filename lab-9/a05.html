<!-- 5. Demonstrate the ‘for of’ loop. -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>
        str = 'darshan';

        for(let ch of str){
            console.log(ch);
        }
        arr = ['darshan','university'];

        for(let ch of arr){
            console.log(ch);
        }
    </script>
 </body>
 </html>
