 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>
        let arr = ['panchotiya', 'om', 'from', 'darshan', 'university'];

        let [a1,,,a4,a5] = arr;


        console.log(a1);
        // console.log(a2);
        // console.log(a3);
        console.log(a4);
        console.log(a5);


        let student={
            name:"Bankai",
            age:18,
            city:"Morbi"
        };
            
        let {name,age}=student;

        console.log(name);
        console.log(age);
    </script>
 </body>
 </html>
