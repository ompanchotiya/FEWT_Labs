<!-- 1. WAP to demonstrate callbacks in JavaScript. -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>
        function anyone(name, callback){
        console.log('callback' + name);
        callback();
        }
        function Goodbye(){
            console.log('goodbye');
        }
        anyone('Bankai',Goodbye);
    </script>
 </body>
 </html>
