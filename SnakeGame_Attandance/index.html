<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Attendance Setup</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        } 
        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .container{
            width:420px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 15px 30px rgba(0,0,0,.2);
        }  
        h1{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }
        label{
            display:block;
            margin-top:18px;
            margin-bottom:8px;
            font-weight:bold;
        }  
        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:17px;
        }
        button{
            width:100%;
            margin-top:30px;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#007bff;
            color:white;
            font-size:18px;
            cursor:pointer;
        }
        button:hover{
            background:#0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
    
        <h1>Attendance Setup</h1>
        
        <label>Minimum Roll Number</label>
        <input type="number" id="minRoll" placeholder="Starting RollNo.">
        
        <label>Maximum Roll Number</label>
        <input type="number" id="maxRoll" placeholder="Ending RollNo.">
        
        <label>Date</label>
        <input type="date" id="date">
        
        <button onclick="startAttendance()">Start Attendance</button>
    </div>
    <script>
        document.getElementById("date").value =
        new Date().toLocaleDateString();
        
        function startAttendance(){
            let minRoll = parseInt(document.getElementById("minRoll").value);
            let maxRoll = parseInt(document.getElementById("maxRoll").value);
            let date = document.getElementById("date").value;
        
            if(minRoll == "" || maxRoll == ""){
                alert("Please enter both roll numbers.");
                return;
            }
            if(minRoll > maxRoll){
                alert("Minimum roll cannot be greater than maximum roll.");
                return;
            }
            localStorage.setItem("minRoll", minRoll);
            localStorage.setItem("maxRoll", maxRoll);
            localStorage.setItem("attendanceDate", date);
            
            window.location.href = "attendance.html";
        }
    </script>
</body>
</html>
