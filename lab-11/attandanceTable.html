<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body{
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(211, 249, 249);
            
        }
        #Tital{
            background-color: white;
            width: 99vw;
            height: 50px;
            display: flex;
            margin-left: auto;
            margin-right: auto;
            margin-top: 20px;
            box-shadow: 2px 2px 10px rgb(75, 234, 234);
        }
        #h1{
            padding-left: 10px;
            font-size: 32px;
            font-weight: 700;
        }
        .container{
            display: flex;
            justify-content: space-between;
            padding: 25px;
            gap: 55px;
        }
        .card{
            background-color: white;
            box-shadow: 2px 2px 10px rgb(75, 234, 234);
            margin-bottom: 20px;
            width: 20px;
        }
        #loadStudent{
            margin-left: auto;
            margin-right: 0;
        }
        select{
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button{
           float: right;
           margin-right: 130px;
           border: none;
           border-radius: 8px;
           background: #2563eb;
           width: 300px;
           height: 50px;
           font-size: 16px;
        }
        button:hover{
            background:#1d4ed8;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        button:active{
            background-color: rgb(81, 246, 81);
            box-shadow: none;
            transform: translateY(3px);
        }
    </style>
</head>
<body>
    <div id="Tital">
        <p id="h1">Take Attandance</p>
    </div>


    <div class="container">
        <div class="card" style="width: 28rem;">
            <div class="card-body">
                <h5 class="card-title">Date</h5>
                <hr>
                <p class="card-subtitle mb-2 text-body-secondary"id="date"></p>
            </div>
        </div>
        <div class="card" style="width: 28rem;" id="Select Class">
            <div class="card-body">
                <h5 class="card-title">Select Class</h5>
                <hr>
                <select id="class">
                    <option value="">--Select Class--</option>
                    <option>B-Tech(CSE) 1rd Sem</option>
                    <option>B-Tech(CSE) 1rd Sem</option>
                    <option>B-Tech(CSE) 1rd Sem</option>
                    <option>B-Tech(CSE) 1rd Sem</option>
                    <option>B-Tech(CSE) 1rd Sem</option>
                </select>
            </div>
        </div>
        <div class="card" style="width: 28rem;">
            <div class="card-body">
                <h5 class="card-title">Card title</h5>
                <h6 class="card-subtitle mb-2 text-body-secondary">Card subtitle</h6>
            </div>
        </div>
    </div>
    <button onclick="showData">Load Student</button>
    <p id="result"></p>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const today = new Date();
        document.getElementById("date").innerHTML = today.toLocaleDateString();
    </script>
</body>
</html>
