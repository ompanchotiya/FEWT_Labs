<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Attendance</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }   
        body{
            background:linear-gradient(135deg,#2193b0,#6dd5ed);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .container{
            width:550px;
            background:#fff;
            padding:40px;
            border-radius:20px;
            box-shadow:0 15px 30px rgba(0,0,0,.2);
            text-align:center;
            height: 75vh;
        } 
        h1{
            color:#333;
            margin-bottom:20px;
        }    
        #rollNumber{
            font-size:90px;
            font-weight:bold;
            color:#007bff;
            margin:30px 0;
        }   
        .info{
            display:flex;
            justify-content:space-between;
            margin-top:30px;
        }  
        .box{
            width:30%;
            background:#f4f4f4;
            padding:15px;
            border-radius:10px;
        }
        .box h2{
            color:#007bff;
            margin-bottom:10px;
        }
        .box p{
            font-size:22px;
            font-weight:bold;
        }
        .instructions{
            margin-top:35px;
            padding:15px;
            border-radius:10px;
            background:#eef8ff;
            color:#333;
            line-height:30px;
        }
        .instructions span{
            color:red;
            font-weight:bold;
        }
        .progressBar{
            width:100%;
            height:18px;
            background:#ddd;
            margin-top:30px;
            border-radius:20px;
            overflow:hidden;
        }
        #progressFill{
            width:0%;
            height:100%;
            background:#28a745;
            transition:.3s;
        }
        #message{
            margin-top:20px;
            font-size:22px;
            font-weight:bold;
            color:green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Attendance System</h1>
        
        <h2>Current Roll Number</h2>
        <div id="rollNumber">1</div>

        <div class="info">
            <div class="box">
                <h2>Present</h2>
                <p id="presentCount">0</p>
            </div>

            <div class="box">
                <h2>Absent</h2>
                <p id="absentCount">0</p>
            </div>

            <div class="box">
                <h2>Progress</h2>
                <p id="progress">0/0</p>
            </div>
        </div>
        <div class="progressBar">
            <div id="progressFill"></div>
        </div>

        <div id="message"></div>
    
        <div class="instructions">
            <div><span>ENTER</span> → Present</div>
            <div><span>DELETE</span> → Absent</div>
        </div>
    </div>
    <script>
        let minRoll = Number(localStorage.getItem("minRoll"));
        let maxRoll = Number(localStorage.getItem("maxRoll"));
        let date = localStorage.getItem("attendanceDate");
        
        if (!minRoll || !maxRoll) {
            alert("Please start attendance from the first page.");
            window.location.href = "index.html";
        }
        
        let currentRoll = minRoll;
        let present = 0;
        let absent = 0;
        
        let attendanceData = [];
        
        updateScreen();
        
        document.addEventListener("keydown", function(e){
        
            if(e.key === "Enter"){
                markAttendance("Present");
            }
        
            if(e.key === "Delete" || e.key === "Backspace"){
                e.preventDefault();
                markAttendance("Absent");
            }
        
        });
        
        function markAttendance(status){
        
            attendanceData.push({
                roll: currentRoll,
                status: status,
                date: date
            });
        
            if(status === "Present"){
                present++;
                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerHTML = "Present";
            }
            else{
                absent++;
                document.getElementById("message").style.color = "red";
                document.getElementById("message").innerHTML = "Absent";
            }
        
            setTimeout(function(){
        
                currentRoll++;
        
                if(currentRoll >= maxRoll){
        
                    localStorage.setItem(
                        "attendanceData",
                        JSON.stringify(attendanceData)
                    );
        
                    window.location.href = "report.html";
                    return;
                }
        
                updateScreen();
        
            },300);
        
        }
        
        function updateScreen(){
        
            document.getElementById("rollNumber").innerHTML = currentRoll;
        
            document.getElementById("presentCount").innerHTML = present;
        
            document.getElementById("absentCount").innerHTML = absent;
        
            let total = maxRoll - minRoll + 1;
            let done = currentRoll - minRoll;
        
            document.getElementById("progress").innerHTML =
                done + " / " + total;
        
            document.getElementById("progressFill").style.width =
                (done / total * 100) + "%";
        
            document.getElementById("message").innerHTML = "";
        
        }
    </script>

</body>
</html>
