<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = [],n=5

        for(let i=0;i<n;i++){
            a[i]=parseInt(prompt("enter a number:"))
        }

        for(let i=0;i<n-1;i++){
            for(let j=0;j<n-i-1;j++){
                if(a[j]>a[j+1]){
                temp=a[j]
                a[j]=a[j+1]
                a[j+1]=temp
                }
            }
        }
        for(let i=0;i<n;i++){
            document.write(a[i])
        }
    </script>
</body>
</html>
