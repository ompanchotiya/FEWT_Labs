<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = [],index=0

        for(let i=0;i<5;i++){
            a[i]=prompt("enter a string:")
        }

        let word = prompt("Enter a number you want to search")

        for(let i=0;i<a.length;i++){
            if(a[i]==word){
                index = i
                break;
            }
        }
        if(index !=0){
            document.write(index)
        }
        else(
            document.write("word not found")
        )
    </script>
</body>
</html>
