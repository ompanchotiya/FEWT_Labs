<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let may = ["mayank","om","nayan","raj","prit"]

        may.push("suresh");
        document.write("push: "+may+"</br>")
        may.pop();
        document.write("pop: "+may+"</br>")
        may.shift();
        document.write("shift: "+may+"</br>")
        may.unshift("ramesh");
        document.write("unshift: "+may+"</br>")
        may.splice(2, 1, "akhil");
        document.write("splice: "+may+"</br>")
        may.sort();
        document.write("sort: "+may+"</br>")
        may.reverse();
        document.write("reverse: "+may+"</br>")

        let array = ["mamu","jungli","mayank","abd"]
        res = array.slice(2,4)
        document.write("slice: "+res+"</br>")
        document.write("original array: "+array+"</br>")

    </script>
</body>
</html>
