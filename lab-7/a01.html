<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            width: 100%
        }
    </style>
</head>
<body>
    <table border="1px solid black">
        <Thead>
            <tr>
                <th colspan="4"><input type="text" id="screen"></th>
            </tr>
        </Thead>
        <tbody>
            <tr>
                <td><button onclick="delByLast()">del</button></td>
                <td><button onclick="display('/')">/</button></td>
                <td><button onclick="display('+')">+</button></td>
                <td><button onclick="clear1()">AC</button></td>
            </tr>
            <tr>
                <td><button onclick="display('7')">7</button></td>
                <td><button onclick="display('8')">8</button></td>
                <td><button onclick="display('9')">9</button></td>
                <td><button onclick="display('+')">+</button></td>
            </tr>
            <tr>
                <td><button onclick="display('4')">4</button></td>
                <td><button onclick="display('5')">5</button></td>
                <td><button onclick="display('6')">6</button></td>
                <td><button onclick="display('-')">-</button></td>
            </tr>
            <tr>
                <td><button onclick="display('1')">1</button></td>
                <td><button onclick="display('2')">2</button></td>
                <td><button onclick="display('3')">3</button></td>
                <td><button onclick="display('*')">*</button></td>
            </tr>
            <tr>
                <td><button onclick="display('0')">0</button></td>
                <td><button onclick="display('.')">.</button></td>
                <td><button onclick="display('%')">%</button></td>
                <td><button onclick="calculate('ans')">=</button></td>
            </tr>
        </tbody>
    </table>
    <script>
        function display(num){
            document.getElementById('screen').value+=num
        }
        function calculate(){
            exp = document.getElementById('screen').value
            if(exp){
                ans = eval(exp)
                document.getElementById('screen').value = ans
            }
        }
        function clear1(){
            document.getElementById('screen').value = " "
        }
        function delByLast(){
            exp = document.getElementById('screen').value
            if(exp){
                ans = exp.slice(0,-1)
                document.getElementById('screen').value = ans
            }
        }
    </script>
</body>
</html>
